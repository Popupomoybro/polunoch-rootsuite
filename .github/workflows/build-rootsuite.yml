name: build-rootsuite
# Manual only: macOS minutes are billed 10x.  No concurrency group (a new dispatch
# used to cancel the running build).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel      # the only macOS label this account can schedule
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          clang --version | head -1
      - name: build
        run: chmod +x scripts/build.sh && scripts/build.sh
      - name: verify
        run: |
          ls -la out/
          file out/Payload/RootSuite.app/RootSuite
          otool -hv out/Payload/RootSuite.app/RootSuite || true
          ls -la out/Payload/RootSuite.app/Frameworks/
      - name: check the selector + modules are in the binary
        run: |
          strings out/Payload/RootSuite.app/RootSuite | grep -iE "ROOT: |RootSuite|Запустить|Sileo|Terminal|bad_query|PAC-оракул" | sort -u | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: RootSuite-ipa
          path: out/RootSuite.ipa
          if-no-files-found: error
          retention-days: 14
